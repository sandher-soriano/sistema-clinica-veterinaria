<!DOCTYPE HTML>
<html class="h-full" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Premier Can - Restablecer contraseña</title>
<script src="../assets/js/cargando.js"></script>
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300..600,0..1,0&display=block" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;family=Manrope:wght@600;700;800&amp;display=swap" rel="stylesheet"/>
<script src="../assets/js/tailwind-config.js"></script>
<script src="../assets/js/auth-cliente.js"></script>
<link rel="stylesheet" href="../assets/css/styles.css"/>
<link rel="stylesheet" href="../assets/css/mascota.css"/>
<script src="../assets/js/mascota.js" defer></script>
<link rel="stylesheet" href="../assets/css/theme.css"/>
<script src="../assets/js/layout.js" defer></script>
<script src="../assets/js/app-notificaciones.js" defer></script>
</head>
<body class="h-full bg-background font-body-md text-on-background relative overflow-x-hidden">
<div class="absolute inset-0 z-0">
<div class="absolute inset-0 bg-surface/80 backdrop-blur-[2px] z-10"></div>
<img alt="Veterinary Clinic Background" class="w-full h-full object-cover object-center" src="../assets/img/fondo.jpg"/>
</div>
<div class="relative z-20 flex min-h-full items-center justify-center p-margin-mobile md:p-margin-desktop">
<div class="w-full max-w-md bg-surface-container-lowest rounded-lg shadow-[0px_12px_24px_rgba(13,122,135,0.1)] border border-outline-variant p-lg flex flex-col items-center mt-36">
<!-- Mascota: se asoma por el borde y se tapa los ojos con la contraseña (assets/js/mascota.js) -->
<div data-mascota data-especie="gato"></div>
<div class="mb-lg w-24 h-24">
<img alt="Premier Can Logo" class="w-full h-full object-contain" src="../assets/img/logo.jpg"/>
</div>
<h2 class="font-headline-md text-headline-md text-on-surface mb-1 text-center">Nueva contraseña</h2>
<p class="font-body-md text-body-md text-on-surface-variant text-center mb-md">Escribe tu nueva contraseña.</p>

<div class="hidden w-full p-3 rounded-DEFAULT bg-error-container/20 border border-error/30 mb-md" id="bloqueEnlaceInvalido">
<p class="font-body-md text-body-md text-on-surface">Este enlace no es válido o ya venció. <a class="text-primary underline" href="olvide-password.html">Solicita uno nuevo</a>.</p>
</div>

<form class="w-full space-y-md" id="formRestablecer">
<div class="relative">
<input class="block w-full px-4 pt-5 pb-2 text-body-lg text-on-surface bg-[#F1F4F6] border-0 border-b-2 border-outline-variant rounded-t-DEFAULT appearance-none focus:outline-none focus:ring-0 focus:border-primary peer" id="nuevaContrasena" minlength="6" placeholder=" " required type="password"/>
<label class="absolute text-label-md text-on-surface-variant duration-300 transform -translate-y-4 scale-75 top-4 z-10 origin-[0] left-4 peer-focus:text-primary peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-4" for="nuevaContrasena">Nueva contraseña</label>
</div>
<div class="relative">
<input class="block w-full px-4 pt-5 pb-2 text-body-lg text-on-surface bg-[#F1F4F6] border-0 border-b-2 border-outline-variant rounded-t-DEFAULT appearance-none focus:outline-none focus:ring-0 focus:border-primary peer" id="confirmarContrasena" minlength="6" placeholder=" " required type="password"/>
<label class="absolute text-label-md text-on-surface-variant duration-300 transform -translate-y-4 scale-75 top-4 z-10 origin-[0] left-4 peer-focus:text-primary peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-4" for="confirmarContrasena">Confirmar contraseña</label>
</div>
<p class="hidden text-error text-caption font-caption text-center" id="errorRestablecer"></p>
<button class="w-full flex justify-center py-3 px-4 rounded-DEFAULT shadow-sm font-label-md text-on-primary bg-primary hover:bg-primary-container focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors duration-200" type="submit">
                    Guardar nueva contraseña
                </button>
</form>

<div class="hidden w-full mt-md p-3 rounded-DEFAULT bg-primary-container/10 border border-primary/20 text-center" id="resultadoOk">
<p class="font-body-md text-body-md text-on-surface mb-2">Tu contraseña se actualizó correctamente.</p>
<a class="font-label-md text-primary hover:underline" href="login.html">Ir a iniciar sesión</a>
</div>
</div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const correo = params.get('correo');
  const token = params.get('token');

  if (!correo || !token) {
    document.getElementById('formRestablecer').classList.add('hidden');
    document.getElementById('bloqueEnlaceInvalido').classList.remove('hidden');
  }

  document.getElementById('formRestablecer').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorEl = document.getElementById('errorRestablecer');
    errorEl.classList.add('hidden');

    const nuevaContrasena = document.getElementById('nuevaContrasena').value;
    const confirmar = document.getElementById('confirmarContrasena').value;
    if (nuevaContrasena !== confirmar) {
      errorEl.textContent = 'Las contraseñas no coinciden.';
      errorEl.classList.remove('hidden');
      return;
    }

    const boton = e.target.querySelector('button[type="submit"]');
    boton.disabled = true;

    try {
      const resp = await fetch(`${window.API_BASE_URL}/cliente/auth/restablecer-password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ correo, token, nuevaContrasena }),
      });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.mensaje);

      document.getElementById('formRestablecer').classList.add('hidden');
      document.getElementById('resultadoOk').classList.remove('hidden');
    } catch (err) {
      errorEl.textContent = err.message;
      errorEl.classList.remove('hidden');
    } finally {
      boton.disabled = false;
    }
  });
</script>
</body></html>
