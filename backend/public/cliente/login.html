<!DOCTYPE HTML>
<html class="h-full" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Premier Can - Portal de clientes</title>
<script src="../assets/js/cargando.js"></script>
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300..600,0..1,0&display=block" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;family=Manrope:wght@600;700;800&amp;display=swap" rel="stylesheet"/>
<script src="../assets/js/tailwind-config.js"></script>
<script src="../assets/js/auth-cliente.js"></script>
<link rel="stylesheet" href="../assets/css/styles.css"/>
<link rel="stylesheet" href="../assets/css/mascota.css"/>
<script src="../assets/js/mascota.js" defer></script>
<link rel="stylesheet" href="../assets/css/theme.css"/>
<script src="../assets/js/layout.js" defer></script>
<script src="../assets/js/app-notificaciones.js" defer></script>
</head>
<body class="h-full bg-background font-body-md text-on-background relative overflow-x-hidden">
<div class="absolute inset-0 z-0">
<div class="absolute inset-0 bg-surface/80 backdrop-blur-[2px] z-10"></div>
<img alt="Veterinary Clinic Background" class="w-full h-full object-cover object-center" src="../assets/img/fondo.jpg"/>
</div>
<div class="relative z-20 flex min-h-full items-center justify-center p-margin-mobile md:p-margin-desktop">
<div class="w-full max-w-md bg-surface-container-lowest rounded-lg shadow-[0px_12px_24px_rgba(13,122,135,0.1)] border border-outline-variant p-lg flex flex-col items-center mt-36">
<!-- Mascota: se asoma por el borde y se tapa los ojos con la contraseña (assets/js/mascota.js) -->
<div data-mascota data-especie="gato"></div>
<div class="mb-md w-24 h-24">
<img alt="Premier Can Logo" class="w-full h-full object-contain" src="../assets/img/logo.jpg"/>
</div>
<h2 class="font-headline-md text-headline-md text-on-surface mb-1 text-center">Portal de clientes</h2>
<p class="font-body-md text-body-md text-on-surface-variant text-center mb-md">Ingresa para ver a tus mascotas.</p>

<form class="w-full space-y-md" id="loginForm">
<div class="relative">
<input class="block w-full px-4 pt-5 pb-2 text-body-lg text-on-surface bg-[#F1F4F6] border-0 border-b-2 border-outline-variant rounded-t-DEFAULT appearance-none focus:outline-none focus:ring-0 focus:border-primary peer" id="correo" placeholder=" " required type="email"/>
<label class="absolute text-label-md text-on-surface-variant duration-300 transform -translate-y-4 scale-75 top-4 z-10 origin-[0] left-4 peer-focus:text-primary peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-4" for="correo">Correo electrónico</label>
</div>
<div class="relative">
<input class="block w-full px-4 pt-5 pb-2 text-body-lg text-on-surface bg-[#F1F4F6] border-0 border-b-2 border-outline-variant rounded-t-DEFAULT appearance-none focus:outline-none focus:ring-0 focus:border-primary peer" id="contrasena" placeholder=" " required type="password"/>
<label class="absolute text-label-md text-on-surface-variant duration-300 transform -translate-y-4 scale-75 top-4 z-10 origin-[0] left-4 peer-focus:text-primary peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-4" for="contrasena">Contraseña</label>
<button class="absolute inset-y-0 right-0 flex items-center pr-3 text-on-surface-variant hover:text-primary" id="togglePasswordBtn" title="Mostrar u ocultar contraseña" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
<label class="flex items-center gap-3 px-1 cursor-pointer select-none" for="recordarDispositivo">
<input class="w-5 h-5 rounded" id="recordarDispositivo" type="checkbox"/>
<span>
<span class="block font-label-md text-label-md text-on-surface">Recordar este dispositivo por 30 días</span>
<span class="block text-caption font-caption text-on-surface-variant">No uses esta opción en una computadora compartida.</span>
</span>
</label>
<p class="hidden text-error text-caption font-caption text-center" id="loginError"></p>
<button class="w-full flex items-center justify-center py-3 px-4 rounded-DEFAULT shadow-sm font-label-md text-on-primary bg-primary hover:bg-primary-container focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors duration-200" id="btnIngresar" type="submit">
                    Iniciar sesión
                </button>
</form>

<div class="mt-md text-center space-y-2">
<a class="block font-label-md text-primary hover:text-primary-container transition-colors" href="olvide-password.html">¿Olvidé mi contraseña?</a>
<p class="font-caption text-caption text-on-surface-variant">¿No tienes cuenta? Pregunta en recepción de la clínica.</p>
</div>
</div>
</div>

<script>
  // En la app (celular personal) "recordar" viene marcado; en un navegador no,
  // por si es una computadora compartida. El cliente puede cambiarlo.
  const esApp = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
  document.getElementById('recordarDispositivo').checked = esApp;

  // ¿Ya hay una sesión guardada y vigente? Entra directo, sin pedir la contraseña.
  (async () => {
    const token = AuthCliente.obtenerToken();
    if (!token) return;
    document.body.style.visibility = 'hidden'; // evita ver el login un instante antes de entrar
    try {
      const resp = await fetch(`${window.API_BASE_URL}/cliente/auth/me`, { headers: { Authorization: `Bearer ${token}` } });
      if (resp.ok) {
        const propietario = AuthCliente.obtenerPropietario();
        window.location.replace(propietario && propietario.debeCambiarPassword ? 'cambiar-password-inicial.html' : 'mis-mascotas.html');
        return;
      }
      // Sesión vencida o revocada: se limpia y se muestra el login normal
      localStorage.removeItem('pc_cliente_token');
      localStorage.removeItem('pc_cliente_propietario');
    } catch (e) { /* sin conexión: se muestra el login */ }
    document.body.style.visibility = '';
  })();

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const correo = document.getElementById('correo').value.trim();
    const contrasena = document.getElementById('contrasena').value;
    const recordar = document.getElementById('recordarDispositivo').checked;
    const errorEl = document.getElementById('loginError');
    const btnIngresar = document.getElementById('btnIngresar');
    errorEl.classList.add('hidden');
    btnIngresar.classList.add('pc-enviando');

    try {
      const { token, propietario } = await AuthCliente.login(correo, contrasena, recordar);
      AuthCliente.guardarSesion(token, propietario);
      const r = btnIngresar.getBoundingClientRect();
      if (window.PCEfectos) window.PCEfectos.huellitas(r.left + r.width / 2, r.top + r.height / 2);
      setTimeout(() => { if (window.PCCarga) window.PCCarga.mostrar('Iniciando sesión…'); }, 380);
      setTimeout(() => { window.location.href = 'mis-mascotas.html'; }, 850);
    } catch (err) {
      errorEl.textContent = err.message;
      errorEl.classList.remove('hidden');
      btnIngresar.classList.remove('pc-enviando');
    }
  });

  // --- Mostrar/ocultar contraseña ---
  document.getElementById('togglePasswordBtn').addEventListener('click', () => {
    const input = document.getElementById('contrasena');
    const icono = document.querySelector('#togglePasswordBtn .material-symbols-outlined');
    const oculta = input.type === 'password';
    input.type = oculta ? 'text' : 'password';
    icono.textContent = oculta ? 'visibility_off' : 'visibility';
  });
</script>
</body></html>
