<!DOCTYPE HTML>
<html class="h-full" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Mi mascota - Premier Can</title>
<script src="../assets/js/cargando.js"></script>
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300..600,0..1,0&display=block" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;family=Manrope:wght@600;700;800&amp;display=swap" rel="stylesheet"/>
<script src="../assets/js/tailwind-config.js"></script>
<script src="../assets/js/auth-cliente.js"></script>
<link rel="stylesheet" href="../assets/css/styles.css"/>
<link rel="stylesheet" href="../assets/css/theme.css"/>
<script src="../assets/js/layout.js" defer></script>
<script src="../assets/js/app-notificaciones.js" defer></script>
</head>
<body class="min-h-full bg-background font-body-md text-on-background">
<header class="bg-surface-container-lowest border-b border-outline-variant px-margin-mobile md:px-margin-desktop py-4 flex items-center gap-3 sticky top-0 z-10">
<a class="text-on-surface-variant hover:text-primary transition-colors" href="mis-mascotas.html">
<span class="material-symbols-outlined">arrow_back</span>
</a>
<span class="font-headline-md text-headline-md text-primary">Premier Can</span>
</header>

<main class="p-margin-mobile md:p-margin-desktop max-w-3xl mx-auto">
<!-- Ficha de la mascota -->
<div class="bg-surface-container-lowest rounded-xl border border-outline-variant p-lg flex items-center gap-4 mb-md" id="fichaMascota">
<div class="w-20 h-20 rounded-full bg-surface-container-high flex items-center justify-center overflow-hidden shrink-0 border border-outline-variant" id="avatarMascota">
<span class="material-symbols-outlined text-[32px] text-primary">pets</span>
</div>
<div>
<h1 class="font-headline-lg text-headline-lg text-on-surface" id="nombreMascota">Cargando...</h1>
<p class="font-body-md text-body-md text-on-surface-variant" id="infoMascota"></p>
</div>
</div>

<a class="flex items-center justify-center gap-2 w-full py-3 mb-lg bg-primary text-on-primary rounded-lg font-label-md text-label-md hover:bg-primary-container transition-colors" id="linkAgendarCita" href="#">
<span class="material-symbols-outlined text-[18px]">event_available</span> Agendar cita para esta mascota
</a>
<button class="flex items-center justify-center gap-2 w-full py-3 -mt-md mb-lg border border-primary text-primary rounded-lg font-label-md text-label-md transition-colors" id="btnCarnet" type="button">
<span class="material-symbols-outlined text-[18px]">badge</span> Carnet de vacunación (PDF con QR)
</button>

<!-- Pestañas simples -->
<div class="flex gap-2 mb-md">
<button class="px-4 py-2 rounded-full bg-primary text-on-primary font-label-md text-label-md" data-tab="historial" id="tabHistorial">Historial médico</button>
<button class="px-4 py-2 rounded-full bg-surface-container-low text-on-surface-variant font-label-md text-label-md" data-tab="esquemas" id="tabEsquemas">Vacunas y dosis</button>
<button class="px-4 py-2 rounded-full bg-surface-container-low text-on-surface-variant font-label-md text-label-md" data-tab="salud" id="tabSalud">Peso y análisis</button>
</div>

<div class="hidden" id="panelSalud">
<section class="bg-surface-container-lowest rounded-xl border border-outline-variant p-md mb-md">
<h2 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider mb-2">Evolución del peso</h2>
<div id="graficoPesoCliente"><p class="text-on-surface-variant">Cargando…</p></div>
</section>
<section class="bg-surface-container-lowest rounded-xl border border-outline-variant p-md">
<h2 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider mb-2">Análisis y archivos de la clínica</h2>
<div id="listaAdjuntosCliente"><p class="text-on-surface-variant">Cargando…</p></div>
</section>
</div>

<div id="panelHistorial">
<div class="space-y-3" id="listaHistorial">
<p class="text-on-surface-variant">Cargando historial...</p>
</div>
</div>

<div class="hidden" id="panelEsquemas">
<div class="space-y-3" id="listaEsquemas">
<p class="text-on-surface-variant">Cargando...</p>
</div>
</div>
</main>

<script>
  const propietario = AuthCliente.protegerPagina();
  const params = new URLSearchParams(window.location.search);
  const mascotaId = params.get('id');

  if (!mascotaId) {
    window.location.href = 'mis-mascotas.html';
  } else {
    document.getElementById('linkAgendarCita').href = `agendar-cita.html?mascotaId=${mascotaId}`;

  // Carnet de vacunación: en la app se abre en la misma pantalla; en el
  // navegador, en una pestaña nueva abierta en el mismo clic (si no, se bloquea).
  document.getElementById('btnCarnet').addEventListener('click', async () => {
    const enApp = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
    const pestana = enApp ? null : window.open('', '_blank');
    try {
      const { url } = await AuthCliente.apiFetch(`/cliente/mascotas/${mascotaId}/carnet-enlace`);
      if (pestana) pestana.location = url; else window.location.href = url;
    } catch (err) {
      if (pestana) pestana.close();
      alert(err.message);
    }
  });
  }

  const ICONOS_ESPECIE = { Canino: 'sound_detection_dog_barking', Felino: 'cruelty_free', Otro: 'pets' };
  const NOMBRE_ESPECIE = { Canino: 'Perro', Felino: 'Gato', Otro: 'Otro' };
  const BADGE_ESTADO = {
    AlDia: { texto: 'Al día', clases: 'bg-secondary-container text-on-secondary-container' },
    Pendiente: { texto: 'Pendiente', clases: 'bg-surface-variant text-on-surface-variant' },
    Atrasado: { texto: 'Atrasado', clases: 'bg-error-container text-on-error-container' },
  };

  function fechaSoloDia(fechaIso) {
    if (!fechaIso) return null;
    const [y, m, d] = fechaIso.substring(0, 10).split('-').map(Number);
    return new Date(y, m - 1, d);
  }
  function formatearFecha(fechaIso) {
    const f = fechaSoloDia(fechaIso);
    if (!f) return '—';
    return f.toLocaleDateString('es-PE', { day: '2-digit', month: 'short', year: 'numeric' });
  }
  function calcularEdad(fechaNacimiento) {
    const nacimiento = fechaSoloDia(fechaNacimiento);
    if (!nacimiento) return '';
    const hoy = new Date();
    let años = hoy.getFullYear() - nacimiento.getFullYear();
    let meses = hoy.getMonth() - nacimiento.getMonth();
    if (meses < 0) { años--; meses += 12; }
    return años > 0 ? `${años} años` : `${meses} meses`;
  }

  // --- Pestañas ---
  document.getElementById('tabHistorial').addEventListener('click', () => cambiarTab('historial'));
  document.getElementById('tabEsquemas').addEventListener('click', () => cambiarTab('esquemas'));
  document.getElementById('tabSalud').addEventListener('click', () => cambiarTab('salud'));
  function cambiarTab(tab) {
    const paneles = { historial: 'panelHistorial', esquemas: 'panelEsquemas', salud: 'panelSalud' };
    const botones = { historial: 'tabHistorial', esquemas: 'tabEsquemas', salud: 'tabSalud' };
    Object.keys(paneles).forEach((k) => {
      document.getElementById(paneles[k]).classList.toggle('hidden', k !== tab);
      document.getElementById(botones[k]).className = `px-4 py-2 rounded-full font-label-md text-label-md ${k === tab ? 'bg-primary text-on-primary' : 'bg-surface-container-low text-on-surface-variant'}`;
    });
  }

  // Análisis y archivos que subió la clínica (se abren con la sesión del cliente)
  async function cargarAdjuntosCliente() {
    const cont = document.getElementById('listaAdjuntosCliente');
    try {
      const lista = await AuthCliente.apiFetch(`/cliente/mascotas/${mascotaId}/adjuntos`);
      cont.innerHTML = lista.length ? lista.map((a) => `
        <div class="pc-adjunto">
          <span class="pc-adj-ico ${a.TipoArchivo === 'application/pdf' ? 'pdf' : ''}"><span class="material-symbols-outlined">${a.TipoArchivo === 'application/pdf' ? 'picture_as_pdf' : 'image'}</span></span>
          <div class="pc-adj-info"><b>${escHtml(a.Descripcion || a.NombreArchivo)}</b><small>${escHtml(formatearFecha(a.FechaSubida))}</small></div>
          <button class="ver" data-id="${escHtml(a.ArchivoID)}" title="Abrir" type="button"><span class="material-symbols-outlined">open_in_new</span></button>
        </div>`).join('')
        : '<p class="text-on-surface-variant">La clínica todavía no subió análisis ni radiografías.</p>';
    } catch (err) {
      cont.innerHTML = `<p class="text-error">${escHtml(err.message)}</p>`;
    }
  }
  document.getElementById('listaAdjuntosCliente').addEventListener('click', (e) => {
    const ver = e.target.closest('.ver');
    if (ver) PCAbrirArchivo(`/api/cliente/adjuntos/${ver.dataset.id}/descargar`, 'pc_cliente_token');
  });
  // ?tab=esquemas: al tocar un recordatorio de vacuna en el celular se abre directo aquí
  if (params.get('tab') === 'esquemas') cambiarTab('esquemas');

  async function cargarFicha() {
    try {
      const m = await AuthCliente.apiFetch(`/cliente/mascotas/${mascotaId}`);
      document.getElementById('nombreMascota').textContent = m.Nombre;
      document.getElementById('infoMascota').textContent =
        `${NOMBRE_ESPECIE[m.Especie] || m.Especie}${m.Raza ? ' • ' + m.Raza : ''}${m.FechaNacimiento ? ' • ' + calcularEdad(m.FechaNacimiento) : ''}`;

      if (m.FotoURL) {
        document.getElementById('avatarMascota').innerHTML = `<img class="w-full h-full object-cover" src="${escHtml(window.BACKEND_ORIGIN)}${escHtml(m.FotoURL)}">`;
      } else {
        document.getElementById('avatarMascota').innerHTML = `<span class="material-symbols-outlined text-[32px] text-primary">${ICONOS_ESPECIE[m.Especie] || 'pets'}</span>`;
      }
    } catch (err) {
      document.getElementById('nombreMascota').textContent = 'No se pudo cargar';
    }
  }

  async function cargarHistorial() {
    const cont = document.getElementById('listaHistorial');
    try {
      const consultas = await AuthCliente.apiFetch(`/cliente/mascotas/${mascotaId}/historial`);
      PCGraficoPeso(document.getElementById('graficoPesoCliente'),
        consultas.filter((c) => c.PesoKg).map((c) => ({ fecha: c.FechaConsulta, peso: c.PesoKg })));
      if (consultas.length === 0) {
        cont.innerHTML = '<p class="text-on-surface-variant">Todavía no hay consultas registradas.</p>';
        return;
      }
      cont.innerHTML = consultas.map((c) => `
        <div class="bg-surface-container-lowest rounded-xl border border-outline-variant p-md">
          <div class="flex justify-between items-center mb-2">
            <span class="font-label-md text-label-md text-primary">${formatearFecha(c.FechaConsulta)}</span>
            <span class="font-caption text-caption text-on-surface-variant">Dr(a). ${escHtml(c.VeterinarioNombre)}</span>
          </div>
          <p class="font-body-md text-body-md text-on-surface font-semibold mb-1">${escHtml(c.MotivoConsulta)}</p>
          ${c.Diagnostico ? `<p class="font-caption text-caption text-on-surface-variant"><strong>Diagnóstico:</strong> ${escHtml(c.Diagnostico)}</p>` : ''}
          ${c.Tratamiento ? `<p class="font-caption text-caption text-on-surface-variant"><strong>Tratamiento:</strong> ${escHtml(c.Tratamiento)}</p>` : ''}
          <div class="flex flex-wrap items-center gap-2 mt-2">
            ${c.PesoKg ? `<span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-surface-container-high text-on-surface-variant">⚖️ ${escHtml(Number(c.PesoKg))} kg</span>` : ''}
            ${c.CantidadMedicamentos ? `<a class="inline-flex items-center gap-1 px-3 py-1 rounded-full text-xs font-semibold border border-primary text-primary" href="../receta.html?c=${escHtml(c.ConsultaID)}&modo=cliente"><span class="material-symbols-outlined text-[16px]">receipt_long</span>Ver receta</a>` : ''}
          </div>
        </div>
      `).join('');
    } catch (err) {
      cont.innerHTML = `<p class="text-error">${escHtml(err.message)}</p>`;
    }
  }

  async function cargarEsquemas() {
    const cont = document.getElementById('listaEsquemas');
    try {
      const esquemas = await AuthCliente.apiFetch(`/cliente/mascotas/${mascotaId}/esquemas`);
      if (esquemas.length === 0) {
        cont.innerHTML = '<p class="text-on-surface-variant">Todavía no hay vacunas ni desparasitaciones registradas.</p>';
        return;
      }
      cont.innerHTML = esquemas.map((e) => {
        const badge = BADGE_ESTADO[e.Estado];
        return `
          <div class="bg-surface-container-lowest rounded-xl border border-outline-variant p-md flex items-center justify-between gap-3">
            <div>
              <p class="font-body-md text-body-md text-on-surface font-semibold">${escHtml(e.NombreProducto)}</p>
              <p class="font-caption text-caption text-on-surface-variant">${e.FechaAplicacion
                ? `${escHtml(e.TipoEsquema)} • Aplicada el ${formatearFecha(e.FechaAplicacion)}${e.FechaProximaDosis ? ` • Refuerzo: ${formatearFecha(e.FechaProximaDosis)}` : ''}`
                : `${escHtml(e.TipoEsquema)} • Programada para el ${formatearFecha(e.FechaProximaDosis)}`}</p>
            </div>
            <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold shrink-0 ${escHtml(badge.clases)}">${escHtml(badge.texto)}</span>
          </div>`;
      }).join('');
    } catch (err) {
      cont.innerHTML = `<p class="text-error">${escHtml(err.message)}</p>`;
    }
  }

  if (propietario) {
    cargarFicha();
    cargarHistorial();
    cargarAdjuntosCliente();
    cargarEsquemas();
  }
</script>
</body></html>
