<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Receta médica - Premier Can</title>
<script src="assets/js/cargando.js"></script>
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300..600,0..1,0&display=block" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"/>
<style>
  :root { --teal-900:#002e33; --teal-700:#00505a; --teal-600:#00606a; --teal-500:#0d7a87; --ink:#0d2226; --muted:#5d7174; --line:#e1eaec; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; font-family: 'Hanken Grotesk', system-ui, sans-serif; color: var(--ink); background: #eef5f6; }
  .material-symbols-outlined { font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24; vertical-align: middle; }
  .contenedor { max-width: 820px; margin: 0 auto; padding: 24px 16px 48px; }
  .barra { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .barra a { color: var(--teal-600); font-weight: 700; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 11px 18px; border-radius: 14px; border: 0; cursor: pointer; color: #fff; font: 700 14.5px 'Hanken Grotesk', sans-serif;
    background: linear-gradient(135deg, #0d8491, var(--teal-600) 55%, #004c55); box-shadow: 0 10px 22px -10px rgba(0,96,106,.7); }
  .hoja { position: relative; overflow: hidden; background: #fff; border-radius: 22px; padding: 34px 38px; box-shadow: 0 30px 70px -30px rgba(0,60,66,.45); }
  .hoja::after { content: 'Rx'; position: absolute; right: 30px; top: 150px; font: 800 180px/1 'Manrope', sans-serif; color: rgba(13,122,135,.05); pointer-events: none; }
  .membrete { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding-bottom: 18px; border-bottom: 3px solid var(--teal-500); }
  .marca { display: flex; align-items: center; gap: 14px; }
  .marca img { width: 62px; height: 62px; border-radius: 50%; }
  .marca strong { display: block; font: 800 24px/1.1 'Manrope', sans-serif; color: var(--teal-700); }
  .marca small { color: var(--muted); font-size: 12px; letter-spacing: .2em; text-transform: uppercase; }
  .doc { text-align: right; }
  .doc b { display: block; font: 800 18px 'Manrope', sans-serif; letter-spacing: .06em; color: var(--teal-700); }
  .doc span { color: var(--muted); font-size: 13px; }
  .datos { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 10px 18px; margin: 20px 0 6px; padding: 14px 16px; border-radius: 14px; background: #f5f9f9; font-size: 14px; }
  .datos b { display: block; color: var(--muted); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; }
  .alerta { margin-top: 10px; padding: 9px 14px; border-radius: 12px; background: #fdecea; color: #b42318; font-weight: 700; font-size: 14px; }
  h3 { margin: 22px 0 8px; font: 800 15px 'Manrope', sans-serif; color: var(--teal-700); display: flex; align-items: center; gap: 8px; }
  p.texto { margin: 0; line-height: 1.6; white-space: pre-line; }
  .med { display: grid; grid-template-columns: 34px 1fr; gap: 10px; padding: 12px 0; border-bottom: 1px dashed #d6e4e6; }
  .med:last-child { border-bottom: 0; }
  .med .n { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; background: #e3f5f6; color: var(--teal-600); font: 800 14px 'Manrope', sans-serif; }
  .med strong { font-size: 16px; }
  .med div span { display: block; color: var(--muted); font-size: 14px; margin-top: 2px; }
  .vacio { color: var(--muted); }
  .firma { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; margin-top: 46px; }
  .firma .linea { min-width: 260px; text-align: center; padding-top: 8px; border-top: 1.5px solid var(--ink); font-size: 14px; }
  .firma .linea small { display: block; color: var(--muted); font-size: 12px; }
  .pie { margin-top: 22px; color: var(--muted); font-size: 12px; text-align: center; }
  .error { text-align: center; padding: 60px 20px; color: var(--muted); }
  @media (max-width: 640px) { .hoja { padding: 22px 18px; } .datos { grid-template-columns: repeat(2, minmax(0,1fr)); } .firma { flex-direction: column; align-items: stretch; } .doc span { display: none; } }
  @media print {
    @page { size: A5; margin: 10mm; }
    body { background: #fff; } .barra, #pc-splash { display: none !important; }
    .contenedor { padding: 0; max-width: none; } .hoja { box-shadow: none; border-radius: 0; padding: 0; }
    .datos, .alerta, .med .n, .membrete { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
<div class="contenedor">
  <div class="barra">
    <a href="javascript:history.back()"><span class="material-symbols-outlined">arrow_back</span>Volver</a>
    <button class="btn" id="btnImprimir" type="button"><span class="material-symbols-outlined">download</span>Descargar PDF / Imprimir</button>
  </div>
  <div class="hoja" id="hoja"><div class="error">Cargando receta…</div></div>
</div>
<script>
  // ?c=<consultaId>&modo=cliente  -> usa la sesión del portal de clientes;
  // sin modo                      -> usa la sesión del personal.
  const q = new URLSearchParams(location.search);
  const consultaId = q.get('c');
  const esCliente = q.get('modo') === 'cliente';
  const token = localStorage.getItem(esCliente ? 'pc_cliente_token' : 'pc_token');
  const ESPECIE = { Canino: 'Perro', Felino: 'Gato', Otro: 'Otro' };
  const fecha = (f) => (f ? new Date(String(f).slice(0, 10) + 'T12:00:00Z').toLocaleDateString('es-PE', { day: '2-digit', month: 'long', year: 'numeric', timeZone: 'UTC' }) : '—');
  function edad(f) {
    if (!f) return '—';
    const n = new Date(String(f).slice(0, 10)); const h = new Date();
    let a = h.getFullYear() - n.getFullYear(); if (h < new Date(h.getFullYear(), n.getMonth(), n.getDate())) a--;
    return a >= 1 ? `${a} año${a === 1 ? '' : 's'}` : `${Math.max(0, (h.getFullYear() - n.getFullYear()) * 12 + h.getMonth() - n.getMonth())} meses`;
  }

  (async () => {
    const hoja = document.getElementById('hoja');
    try {
      if (!token) throw new Error('Inicia sesión para ver la receta.');
      const r = await fetch(`/api/${esCliente ? 'cliente/' : ''}consultas/${encodeURIComponent(consultaId || '')}/receta`, { headers: { Authorization: `Bearer ${token}` } });
      const d = await r.json();
      if (!r.ok) throw new Error(d.mensaje || 'No se pudo cargar la receta.');
      document.title = `Receta de ${d.PacienteNombre} - Premier Can`;
      const signos = [d.PesoKg ? `${Number(d.PesoKg)} kg` : null, d.TemperaturaC ? `${Number(d.TemperaturaC)} °C` : null].filter(Boolean).join(' · ') || '—';
      hoja.innerHTML = `
        <div class="membrete">
          <div class="marca"><img alt="" src="assets/img/Logo2.jpg"><div><strong>Premier Can</strong><small>Clínica veterinaria</small></div></div>
          <div class="doc"><b>RECETA MÉDICA</b><span>N.º ${escHtml(String(d.ConsultaID).padStart(6, '0'))} · ${escHtml(fecha(d.FechaConsulta))}</span></div>
        </div>
        <div class="datos">
          <div><b>Paciente</b>${escHtml(d.PacienteNombre)}</div>
          <div><b>Especie / raza</b>${escHtml(ESPECIE[d.Especie] || d.Especie)}${d.Raza ? ` · ${escHtml(d.Raza)}` : ''}</div>
          <div><b>Edad / sexo</b>${escHtml(edad(d.FechaNacimiento))} · ${d.Sexo === 'H' ? 'Hembra' : d.Sexo === 'M' ? 'Macho' : '—'}</div>
          <div><b>Peso / temp.</b>${escHtml(signos)}</div>
          <div style="grid-column: span 2"><b>Propietario</b>${escHtml(d.PropietarioNombres)} ${escHtml(d.PropietarioApellidos)}${d.PropietarioDNI ? ` · DNI ${escHtml(d.PropietarioDNI)}` : ''}</div>
          <div style="grid-column: span 2"><b>Motivo de consulta</b>${escHtml(d.MotivoConsulta)}</div>
        </div>
        ${d.Alergias ? `<div class="alerta">⚠️ Alergias conocidas: ${escHtml(d.Alergias)}</div>` : ''}
        ${d.Diagnostico ? `<h3><span class="material-symbols-outlined">stethoscope</span>Diagnóstico</h3><p class="texto">${escHtml(d.Diagnostico)}</p>` : ''}
        <h3><span class="material-symbols-outlined">medication</span>Medicamentos indicados</h3>
        ${d.Medicamentos.length ? d.Medicamentos.map((m, i) => `
          <div class="med"><span class="n">${i + 1}</span><div><strong>${escHtml(m.NombreMedicamento)}</strong>
            <span>${[m.Dosis && `Dosis: ${escHtml(m.Dosis)}`, m.Frecuencia && `Frecuencia: ${escHtml(m.Frecuencia)}`, m.DuracionDias && `Durante ${escHtml(m.DuracionDias)} día${m.DuracionDias === 1 ? '' : 's'}`].filter(Boolean).join(' · ') || 'Según indicación del veterinario'}</span></div></div>`).join('')
          : '<p class="vacio">No se indicaron medicamentos en esta consulta.</p>'}
        ${d.Tratamiento ? `<h3><span class="material-symbols-outlined">assignment</span>Indicaciones</h3><p class="texto">${escHtml(d.Tratamiento)}</p>` : ''}
        ${d.Observaciones ? `<h3><span class="material-symbols-outlined">info</span>Observaciones</h3><p class="texto">${escHtml(d.Observaciones)}</p>` : ''}
        <div class="firma">
          <div style="color:var(--muted);font-size:13px">Ante cualquier reacción adversa, suspenda el medicamento<br>y comuníquese con la clínica.</div>
          <div class="linea"><b>Dr(a). ${escHtml(String(d.VeterinarioNombre || '').replace(/^(dr|dra|dr\(a\))\.?\s+/i, ''))}</b><small>Médico veterinario · Premier Can</small></div>
        </div>
        <div class="pie">Receta emitida por el sistema de Premier Can · Consulta N.º ${escHtml(String(d.ConsultaID).padStart(6, '0'))}</div>`;
    } catch (err) {
      hoja.innerHTML = `<div class="error"><p><b>${escHtml(err.message)}</b></p></div>`;
      document.getElementById('btnImprimir').style.display = 'none';
    }
  })();
  document.getElementById('btnImprimir').addEventListener('click', () => window.print());
</script>
</body></html>
